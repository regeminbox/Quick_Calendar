# 폰에 설치할 APK를 클라우드(EAS)에서 만들고, 이 워크플로의 Artifacts에 quickcalendar.apk로 올린다.
# 준비(한 번): expo.dev 가입 → Account settings → Access tokens → 토큰 발급 →
#   GitHub 저장소 Settings → Secrets and variables → Actions → New repository secret → 이름 EXPO_TOKEN
# 실행: Actions 탭 → "Android APK" → Run workflow → 끝나면 Summary의 링크 또는 Artifacts에서 내려받기
name: Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 시크릿 이름을 EXPO_TOKEN 으로 권장하지만, SECRET / TOKEN / EXPO 로 등록해도 받아준다
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.SECRET || secrets.TOKEN || secrets.EXPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 설치 전 오류 점검 (lint · typecheck · test)
        run: |
          npm run lint
          npm run typecheck
          npm test -- --ci
      - name: Expo 토큰 확인
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Expo 토큰 시크릿을 찾지 못했어요. 저장소 Settings → Secrets and variables → Actions 에서 이름을 EXPO_TOKEN 으로 등록해 주세요 (expo.dev → Access tokens 에서 발급)."
            exit 1
          fi
          echo "Expo 토큰 확인됨"
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
      - name: EAS 프로젝트 연결 (app.json에 projectId가 없을 때만)
        run: |
          if ! node -e "const a=require('./app.json');process.exit(a.expo?.extra?.eas?.projectId?0:1)"; then
            eas init --non-interactive --force
          fi
      - name: APK 빌드 (preview 프로필)
        id: build
        run: |
          eas build --platform android --profile preview --non-interactive --json > build.json
          cat build.json
          URL=$(node -e "const b=require('./build.json');const x=Array.isArray(b)?b[0]:b;console.log(x.artifacts?.buildUrl||x.artifacts?.applicationArchiveUrl||'')")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### 퀵캘린더 APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 다운로드 링크: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- 아래 Artifacts의 quickcalendar.apk 로도 받을 수 있어요 (폰에서 열어 설치, '출처를 알 수 없는 앱' 허용)" >> "$GITHUB_STEP_SUMMARY"
      - name: APK 내려받기
        if: steps.build.outputs.url != ''
        run: curl -fsSL "${{ steps.build.outputs.url }}" -o quickcalendar.apk
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.url != ''
        with:
          name: quickcalendar-apk
          path: quickcalendar.apk
          retention-days: 30
